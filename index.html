<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>JARVIS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--c:#3df2ff;--bg:#02060d;--dim:rgba(61,242,255,.55);--a:#ffb347}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 38%,#0b2638 0,#02060d 62%);color:#d8fbff;font-family:'Rajdhani',system-ui,sans-serif;font-size:18px;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 10px);height:100dvh;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(61,242,255,.05) 1px,transparent 1px) 0 0/100% 4px;pointer-events:none}
header{text-align:center;padding-top:14px}
h1{font-family:'Orbitron',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:.5em;padding-left:.5em;color:var(--c);text-shadow:0 0 16px var(--c)}
#status{margin-top:4px;color:var(--dim);font-size:1rem;min-height:1.4em}
.stage{flex:1;display:grid;place-items:center;width:100%;min-height:0}
.orb{position:relative;width:min(68vw,40dvh,300px);aspect-ratio:1;display:grid;place-items:center;background:none;border:0;border-radius:50%;cursor:pointer}
.ring{position:absolute;border-radius:50%}
.r1{inset:0;border:2px solid transparent;border-top-color:var(--c);border-bottom-color:var(--c);animation:spin 9s linear infinite}
.r2{inset:11%;border:2px dashed var(--dim);animation:spin 16s linear infinite reverse}
.r3{inset:22%;border:4px solid transparent;border-left-color:var(--c);border-right-color:var(--c);animation:spin 5s linear infinite}
.r4{inset:3%;background:repeating-conic-gradient(var(--dim) 0 1deg,transparent 1deg 6deg);-webkit-mask:radial-gradient(circle,transparent 90%,#000 91%);mask:radial-gradient(circle,transparent 90%,#000 91%)}
.core{width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,#b8fbff 22%,var(--c) 55%,#0a6f86 100%);box-shadow:0 0 40px 10px rgba(61,242,255,.55);animation:breathe 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.07);box-shadow:0 0 60px 16px rgba(61,242,255,.7)}}
@keyframes talk{0%,100%{transform:scale(.95)}50%{transform:scale(1.22)}}
body[data-state=listening] .r1{animation-duration:3s}
body[data-state=listening] .core{animation:breathe .9s ease-in-out infinite}
body[data-state=thinking] .r3{animation-duration:.8s}
body[data-state=speaking] .core{animation:talk .45s ease-in-out infinite}
body[data-state=speaking] .r2{animation-duration:4s}
body[data-state=error]{--c:var(--a);--dim:rgba(255,179,71,.6)}
body[data-state=error] .core{background:radial-gradient(circle,#fff 0,#ffe0b0 22%,var(--a) 55%,#7a4a0a 100%);box-shadow:0 0 40px 10px rgba(255,179,71,.5)}
#live{min-height:1.6em;text-align:center;color:#fff;font-size:1.15rem;padding:0 6px}
#log{width:100%;max-width:520px;max-height:27dvh;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 12px;border-left:3px solid var(--dim);background:rgba(61,242,255,.06);line-height:1.35;word-break:break-word}
.m.you{border-left-color:#8aa;color:#9fb8bd}
.m.jarvis{border-left-color:var(--c)}
.m a{display:inline-block;margin-top:6px;color:#02060d;background:var(--c);padding:4px 12px;text-decoration:none;font-weight:600;border-radius:4px}
.bar{width:100%;max-width:520px;display:flex;gap:8px;margin-top:8px}
.bar input{flex:1;min-width:0;background:rgba(61,242,255,.07);border:1px solid var(--dim);color:#fff;padding:10px 12px;font:inherit;border-radius:6px}
.bar button{background:transparent;border:1px solid var(--c);color:var(--c);padding:10px 12px;font:inherit;font-weight:600;border-radius:6px}
.bar button[aria-pressed=true]{background:var(--c);color:#02060d}
body[data-state=wake] .r1{animation-duration:22s}
body[data-state=wake] .core{opacity:.65}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-state="idle">
<header>
  <h1>JARVIS</h1>
  <div id="status">तैयार — बीच के गोले को दबाइए</div>
</header>
<div class="stage">
  <button class="orb" id="orb" aria-label="बोलने के लिए दबाइए">
    <span class="ring r4"></span><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
  </button>
</div>
<div id="live" aria-live="polite"></div>
<div id="log"></div>
<div class="bar">
  <input id="txt" placeholder="या यहाँ लिखकर पूछिए…" enterkeyhint="send">
  <button id="send">भेजो</button>
  <button id="auto" aria-pressed="false" title="जवाब के बाद अपने आप सुनना शुरू करे">लगातार</button>
  <button id="wake" aria-pressed="false" title="हाय जार्विस बोलकर जगाइए">वेक</button>
</div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, voice = null, auto = false, wrec = null, wakeOn = false, lock = null;

function setState(s, t) {
  document.body.dataset.state = s;
  if (t) $('status').textContent = t;
}
function addMsg(who, text, link) {
  const d = document.createElement('div');
  d.className = 'm ' + who;
  d.textContent = text;
  if (link) {
    const a = document.createElement('a');
    a.href = link.href; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = link.label;
    d.appendChild(document.createElement('br'));
    d.appendChild(a);
  }
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

/* ---------- आवाज़ (बोलना) ---------- */
function loadVoice() {
  const v = speechSynthesis.getVoices();
  voice = v.find(x => x.lang === 'hi-IN') || v.find(x => x.lang.toLowerCase().startsWith('hi')) || null;
}
if ('speechSynthesis' in window) {
  loadVoice();
  speechSynthesis.onvoiceschanged = loadVoice;
}
function speak(text, done) {
  if (!('speechSynthesis' in window)) { setState('idle', 'तैयार'); done && done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'hi-IN';
  if (voice) u.voice = voice;
  u.rate = 0.95; u.pitch = 0.9;
  u.onstart = () => setState('speaking', 'बोल रहा हूँ…');
  const end = () => { setState('idle', 'तैयार — गोले को दबाइए'); done && done(); };
  u.onend = end; u.onerror = end;
  speechSynthesis.speak(u);
}

/* ---------- दिमाग (जवाब तय करना) ---------- */
const jokes = [
  'मोबाइल ने चार्जर से कहा, तुम्हारे बिना मैं अधूरा हूँ। चार्जर बोला, मुझे पता है, इसीलिए तो तुम हर बार मुझे ढूँढते हो।',
  'एक कंप्यूटर डॉक्टर के पास गया और बोला, डॉक्टर साहब, मुझे वायरस हो गया है। डॉक्टर ने कहा, पहले खुद को रीस्टार्ट करके आओ।',
  'टीचर ने पूछा, पानी का रंग क्या होता है? बच्चा बोला, सर, जिस बर्तन में डालो, उसी का।'
];
const has = (t, ...w) => w.some(x => t.includes(x));

function reply(raw) {
  const t = raw.toLowerCase().trim();
  const now = new Date();

  if (has(t, 'बंद करो', 'चुप', 'स्टॉप', 'stop'))
    return { say: 'ठीक है, मैं चुप हो जाता हूँ।' };

  const cm = t.match(/(\d+(?:\.\d+)?)\s*(जोड़|जोड|प्लस|plus|\+|घटा|घटाओ|माइनस|minus|-|गुणा|इनटू|×|x|भाग|डिवाइड|\/)\s*(\d+(?:\.\d+)?)/);
  if (cm) {
    const a = +cm[1], b = +cm[3], o = cm[2];
    let v;
    if (/जोड|प्लस|plus|\+/.test(o)) v = a + b;
    else if (/घटा|माइनस|minus|-/.test(o)) v = a - b;
    else if (/गुणा|इनटू|×|x/.test(o)) v = a * b;
    else { if (!b) return { say: 'शून्य से भाग नहीं हो सकता।' }; v = a / b; }
    return { say: 'जवाब ' + Math.round(v * 1000) / 1000 + ' है।' };
  }
  const cn = t.replace(/[\s-]/g, '').match(/(?:कॉल|call|फोन|फ़ोन)[^\d]*(\d{10})/);
  if (cn) return { say: 'नंबर ' + cn[1].split('').join(' ') + ' पर कॉल करने के लिए बटन दबाइए।', link: { href: 'tel:' + cn[1], label: 'कॉल करो' } };
  if (has(t, 'रास्ता', 'नक्शा', 'मैप', 'map', 'navigate')) {
    const q = t.replace(/का रास्ता|रास्ता|नक्शा|मैप्स|मैप|दिखाओ|बताओ|map|navigate/g, '').trim();
    return { say: 'नक्शा खोलने के लिए नीचे का बटन दबाइए।', link: { href: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q || t), label: 'नक्शा खोलो' } };
  }
  if (has(t, 'गाना', 'गाने', 'song')) {
    const q = t.replace(/यूट्यूब पर|यूट्यूब|चलाओ|सुनाओ|बजाओ|गाना|गाने|song/g, '').trim();
    return { say: 'गाना सुनने के लिए नीचे का बटन दबाइए।', link: { href: 'https://www.youtube.com/results?search_query=' + encodeURIComponent((q + ' गाना').trim()), label: 'गाना चलाओ' } };
  }
  if (has(t, 'सर्च', 'खोज', 'गूगल', 'search', 'google')) {
    const q = t.replace(/गूगल पर|गूगल|सर्च करो|सर्च|खोजो|खोज|search for|search|google/g, '').trim();
    if (q) return { say: 'ठीक है सर, ' + q + ' खोजने के लिए नीचे का बटन दबाइए।', link: { href: 'https://www.google.com/search?q=' + encodeURIComponent(q), label: 'गूगल पर खोजो' } };
    return { say: 'क्या खोजना है? बोलिए, जैसे, गूगल पर क्रिकेट स्कोर खोजो।' };
  }
  if (has(t, 'यूट्यूब', 'youtube'))
    return { say: 'यूट्यूब खोलने के लिए नीचे का बटन दबाइए।', link: { href: 'https://www.youtube.com', label: 'यूट्यूब खोलो' } };
  if (has(t, 'मौसम', 'weather'))
    return { say: 'मौसम की जानकारी के लिए नीचे का बटन दबाइए।', link: { href: 'https://www.google.com/search?q=' + encodeURIComponent('मौसम आज'), label: 'आज का मौसम' } };
  if (has(t, 'समय', 'टाइम', 'time', 'बजे')) {
    const s = now.toLocaleTimeString('hi-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
    return { say: 'अभी समय ' + s + ' है।' };
  }
  if (has(t, 'तारीख', 'तारिख', 'date', 'कौन सा दिन', 'आज का दिन', 'आज कौन')) {
    const s = now.toLocaleDateString('hi-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return { say: 'आज ' + s + ' है।' };
  }
  if (has(t, 'जोक', 'चुटकुला', 'हँसाओ', 'हसाओ', 'joke'))
    return { say: jokes[Math.floor(Math.random() * jokes.length)] };
  if (has(t, 'कैसे हो', 'कैसी हो', 'कैसा है', 'how are you'))
    return { say: 'मैं बिल्कुल ठीक हूँ सर। सारे सिस्टम काम कर रहे हैं। आप बताइए?' };
  if (has(t, 'नाम', 'कौन हो', 'कौन है', 'who are you', 'your name'))
    return { say: 'मेरा नाम जार्विस है। मैं आपका पर्सनल वॉइस असिस्टेंट हूँ। मैं समय, तारीख, चुटकुले और गूगल या यूट्यूब खोलने में मदद कर सकता हूँ।' };
  if (has(t, 'धन्यवाद', 'शुक्रिया', 'थैंक', 'thank'))
    return { say: 'आपका स्वागत है सर।' };
  if (has(t, 'नमस्ते', 'नमस्कार', 'हेलो', 'हैलो', 'हाय', 'जार्विस', 'जारविस', 'jarvis', 'hello', 'hi')) {
    const h = now.getHours();
    const g = h < 12 ? 'सुप्रभात' : h < 17 ? 'नमस्कार' : h < 21 ? 'शुभ संध्या' : 'शुभ रात्रि';
    return { say: g + ' सर। बताइए, मैं आपकी क्या मदद कर सकता हूँ?' };
  }
  if (!navigator.onLine) return { say: 'माफ़ कीजिए, यह मुझे समझ नहीं आया और इंटरनेट बंद है, इसलिए खोज भी नहीं सकता।' };
  return {
    say: 'माफ़ कीजिए, यह मुझे पूरी तरह समझ नहीं आया। चाहें तो मैं इसे गूगल पर खोज सकता हूँ।',
    link: { href: 'https://www.google.com/search?q=' + encodeURIComponent(raw), label: 'गूगल पर खोजो' }
  };
}

function handle(text) {
  if (!text.trim()) return;
  $('live').textContent = '';
  addMsg('you', text);
  setState('thinking', 'सोच रहा हूँ…');
  const r = reply(text);
  addMsg('jarvis', r.say, r.link);
  speak(r.say, () => { if (auto) startListening(); else if (wakeOn) startWake(); });
}

/* ---------- कान (सुनना) ---------- */
function showError(msg) {
  setState('error', msg);
  addMsg('jarvis', msg);
}
function startListening() {
  if (!SR) { showError('इस ब्राउज़र में आवाज़ पहचान नहीं है। कृपया Android Chrome इस्तेमाल करें।'); return; }
  if (!navigator.onLine) { showError('इंटरनेट बंद है। बोलकर पूछना बंद है, लिखकर पूछिए।'); return; }
  if (wrec) { wrec.onend = null; try { wrec.abort(); } catch (e) {} }
  if (rec) { try { rec.abort(); } catch (e) {} }
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = 'hi-IN';
  rec.interimResults = true;
  rec.continuous = false;
  let got = false;
  rec.onstart = () => setState('listening', 'सुन रहा हूँ… बोलिए');
  rec.onresult = e => {
    let txt = '', fin = false;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      txt += e.results[i][0].transcript;
      if (e.results[i].isFinal) fin = true;
    }
    $('live').textContent = txt;
    if (fin) { got = true; handle(txt); }
  };
  rec.onerror = e => {
    if (e.error === 'no-speech') {
      $('live').textContent = '';
      if (auto) return;
      setState('idle', 'कुछ सुनाई नहीं दिया। फिर से दबाइए।');
      if (wakeOn) setTimeout(startWake, 400);
    } else if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      auto = false; $('auto').setAttribute('aria-pressed', 'false');
      showError('माइक की अनुमति नहीं मिली। Chrome में पते के पास ताले का निशान दबाकर माइक को Allow करें।');
    } else if (e.error === 'audio-capture') {
      showError('माइक नहीं मिला। देखिए कि दूसरा ऐप माइक इस्तेमाल तो नहीं कर रहा।');
    } else if (e.error === 'network') {
      showError('इंटरनेट की समस्या है। आवाज़ पहचान के लिए इंटरनेट चाहिए।');
    }
  };
  rec.onend = () => {
    if (document.body.dataset.state === 'listening') {
      setState('idle', 'तैयार — गोले को दबाइए');
      if (auto && !got) setTimeout(startListening, 400);
      else if (wakeOn && !got) setTimeout(startWake, 400);
    }
  };
  try { rec.start(); } catch (e) {}
}

/* ---------- वेक वर्ड: "हाय जार्विस" ---------- */
const WAKE = /जार्विस|जारविस|जरविस|जार्वीस|जर्विस|जार्विश|jarvis/i;
function startWake() {
  if (!SR || !wakeOn) return;
  if (!navigator.onLine) { setState('idle', 'इंटरनेट बंद है — वेक मोड रुका है'); return; }
  if (wrec) { wrec.onend = null; try { wrec.abort(); } catch (e) {} }
  wrec = new SR();
  wrec.lang = 'hi-IN'; wrec.continuous = true; wrec.interimResults = true;
  wrec.onstart = () => setState('wake', '"हाय जार्विस" बोलिए');
  wrec.onresult = e => {
    let t = '';
    for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
    const m = WAKE.exec(t);
    if (!m) return;
    const last = e.results[e.results.length - 1];
    const rest = t.slice(m.index + m[0].length).replace(/^[\s,।]+/, '');
    wrec.onend = null; try { wrec.abort(); } catch (x) {}
    if (last.isFinal && rest.length > 2) handle(rest);
    else speak('जी सर?', () => startListening());
  };
  wrec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      setWake(false);
      showError('माइक की अनुमति नहीं मिली। Chrome में ताले के निशान से माइक Allow करें।');
    }
  };
  wrec.onend = () => { if (wakeOn && document.body.dataset.state === 'wake') setTimeout(startWake, 300); };
  try { wrec.start(); } catch (e) {}
}
async function getLock() { try { lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function setWake(on) {
  wakeOn = on;
  $('wake').setAttribute('aria-pressed', on);
  if (on) {
    addMsg('jarvis', 'वेक मोड चालू। स्क्रीन चालू रखकर "हाय जार्विस" बोलिए।');
    startWake(); getLock();
  } else {
    if (wrec) { wrec.onend = null; try { wrec.abort(); } catch (e) {} }
    if (lock) { lock.release(); lock = null; }
    setState('idle', 'तैयार — गोले को दबाइए');
  }
}
$('wake').addEventListener('click', () => setWake(!wakeOn));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeOn) { getLock(); startWake(); } });
window.addEventListener('offline', () => addMsg('jarvis', 'इंटरनेट बंद है। बोलकर पूछना रुका है, लेकिन लिखकर पूछ सकते हैं।'));
window.addEventListener('online', () => { addMsg('jarvis', 'इंटरनेट वापस आ गया।'); if (wakeOn) startWake(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

$('orb').addEventListener('click', () => {
  if (document.body.dataset.state === 'listening') { try { rec.stop(); } catch (e) {} }
  else startListening();
});
$('send').addEventListener('click', () => { const v = $('txt').value; $('txt').value = ''; handle(v); });
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });
$('auto').addEventListener('click', () => {
  auto = !auto;
  $('auto').setAttribute('aria-pressed', auto);
  if (auto) startListening();
});
